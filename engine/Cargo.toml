[package]
name = "field-gym-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
magba = { version = "0.6.2", default-features = false, features = ["std"] }
nalgebra = { version = "0.34.2", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
